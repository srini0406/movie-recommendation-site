services:
  - type: web
    name: movie-recommendation-system
    env: python
    region: oregon
    plan: free
    buildCommand: "chmod +x build.sh && bash build.sh"
    startCommand: "gunicorn movie_recommendation.wsgi:application --workers 2 --timeout 120 --log-level info"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MODEL_DIR
        value: "models"
    healthCheckPath: /api/health/
